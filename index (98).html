<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EgyGulf Foods | Food Africa</title>
<meta name="description" content="سجّل بياناتك مع إيجي جالف فودز وكمّل تسجيل زيارتك لمعرض Food Africa.">
<meta property="og:title" content="EgyGulf Foods | Food Africa">
<meta property="og:description" content="زورونا في معرض Food Africa">
<meta name="theme-color" content="#2E2A72">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2E2A72; --navy-dark:#221F5C; --gold:#F9B917; --red:#E31E24; --wine:#6B0A22;
    --ink:#1C1A3A; --muted:#6C6A86; --line:#DEDCEB; --field:#F7F7FB; --err:#C62828; --ok:#1E8E5A;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{font-family:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.6;
    background:var(--navy-dark);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

  .page{flex:1;position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(160deg,var(--navy-dark) 0%,var(--navy) 60%,var(--navy) 100%);
    padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .page::before,.page::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(70px)}
  .page::before{width:620px;height:620px;left:-160px;top:-180px;
    background:radial-gradient(circle,rgba(227,30,36,.75) 0%,rgba(107,10,34,.55) 45%,transparent 70%)}
  .page::after{width:560px;height:560px;left:18%;bottom:-260px;
    background:radial-gradient(circle,rgba(249,185,23,.32) 0%,rgba(227,30,36,.25) 40%,transparent 70%)}
  .glow{position:absolute;width:480px;height:480px;right:-140px;top:30%;border-radius:50%;filter:blur(80px);pointer-events:none;
    background:radial-gradient(circle,rgba(107,10,34,.7) 0%,rgba(59,42,110,.4) 50%,transparent 70%)}
  .wrap{max-width:1100px;margin:0 auto;position:relative;z-index:1}

  .top{display:flex;align-items:center;gap:16px}
  .logo{border-radius:12px;display:inline-flex;overflow:hidden;height:58px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
  .logo.eg{background:#fff;padding:9px 14px}
  .logo.fa{background:#ED1C24}
  .logo img{height:100%;width:auto;display:block}
  .x{font-size:30px;font-weight:300;line-height:1;color:rgba(255,255,255,.85)}

  .body{display:grid;grid-template-columns:1fr 440px;gap:56px;align-items:center;margin-top:56px}
  .body > *{min-width:0}
  h1{font-weight:800;font-size:clamp(30px,4.6vw,48px);line-height:1.3;margin:0 0 14px}
  h1 span{color:var(--gold)}
  .lead{font-size:18px;opacity:.9;margin:0;max-width:44ch}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0;padding:0;list-style:none}
  .cats li{font-size:14px;font-weight:600;padding:5px 14px;border-radius:8px;background:var(--gold);color:var(--navy-dark)}

  .card{background:#fff;color:var(--ink);border-radius:18px;padding:28px 26px;box-shadow:0 24px 50px -18px rgba(0,0,0,.45)}
  .card h2{font-size:22px;font-weight:800;margin:0 0 18px;color:var(--navy)}

  form{display:grid;gap:14px}
  .field{display:grid;gap:6px}
  .field label{font-size:14px;font-weight:700}
  .field label small{font-weight:400;color:var(--muted);font-size:13px}
  .input{display:flex;border:1.5px solid var(--line);border-radius:12px;background:var(--field);transition:border-color .2s}
  .input:focus-within{border-color:var(--navy);background:#fff}
  .input input,.input select{font:inherit;font-size:16px;border:0;background:transparent;color:var(--ink);padding:12px 14px;width:100%;min-width:0;outline:none}
  .input select{width:auto;flex:none;padding-inline:12px 8px;border-inline-end:1.5px solid var(--line);cursor:pointer}
  .field.bad .input{border-color:var(--err)}
  .msg{font-size:13px;color:var(--err)}
  .msg:empty{display:none}

  .btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:12px;padding:14px;margin-top:4px;cursor:pointer;
    color:#fff;background:var(--navy);transition:background .2s}
  .btn:hover{background:var(--navy-dark)}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .btn[disabled]{opacity:.8;cursor:wait}

  .done{text-align:center;padding:20px 0 8px}
  .done .ok{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
  .done .ok svg{width:32px;height:32px;color:#fff}
  .done h3{font-size:20px;font-weight:800;margin:0 0 6px;color:var(--navy)}
  .done p{margin:0 0 8px;color:var(--muted);font-size:15px}
  .done a{font-weight:700;color:var(--navy)}

  footer{background:var(--navy-dark);color:rgba(255,255,255,.6);text-align:center;font-size:13px;
    padding:14px 16px max(16px,env(safe-area-inset-bottom,0px))}

  @media (max-width:900px){
    .page::before{width:420px;height:420px;left:-180px;top:-120px}
    .page::after{width:380px;height:380px;left:auto;right:-160px;bottom:-140px}
    .glow{width:320px;height:320px;right:-120px;top:22%}
    .body{grid-template-columns:1fr;gap:28px;margin-top:32px}
  }
  @media (max-width:480px){
    .logo{height:46px}
    .logo.eg{padding:7px 10px}
    .top{gap:10px}
    .x{font-size:24px}
    .card{padding:22px 18px}
    .lead{font-size:16px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

    <div class="body">
      <div>
        <h1>زورونا في معرض <span>Food Africa</span></h1>
        <p class="lead">إيجي جالف فودز بتستناك في المعرض. سجّل بياناتك وكمّل تسجيل زيارتك.</p>
        <ul class="cats">
          <li>حلويات</li><li>مصاصات</li><li>مكرونة</li><li>سناكس</li>
        </ul>
      </div>

      <div class="card">
        <div id="formView">
          <h2>سجّل بياناتك</h2>
          <form id="f" novalidate>
            <div class="field" id="fName">
              <label for="name">الاسم</label>
              <div class="input"><input id="name" name="name" autocomplete="name" required></div>
              <div class="msg" id="mName"></div>
            </div>

            <div class="field">
              <label for="company">الشركة <small>(اختياري)</small></label>
              <div class="input"><input id="company" name="company" autocomplete="organization"></div>
            </div>

            <div class="field" id="fPhone">
              <label for="phone">رقم الموبايل</label>
              <div class="input" dir="ltr">
                <select id="cc" name="cc" aria-label="كود الدولة">
                  <option value="+20" selected>+20 مصر</option>
                  <option value="+966">+966 السعودية</option>
                  <option value="+971">+971 الإمارات</option>
                  <option value="+965">+965 الكويت</option>
                  <option value="+974">+974 قطر</option>
                  <option value="+968">+968 عمان</option>
                  <option value="+973">+973 البحرين</option>
                  <option value="+962">+962 الأردن</option>
                  <option value="+964">+964 العراق</option>
                  <option value="+961">+961 لبنان</option>
                  <option value="+218">+218 ليبيا</option>
                  <option value="+213">+213 الجزائر</option>
                  <option value="+216">+216 تونس</option>
                  <option value="+212">+212 المغرب</option>
                  <option value="+249">+249 السودان</option>
                  <option value="+967">+967 اليمن</option>
                  <option value="+">دولة أخرى</option>
                </select>
                <input id="phone" name="phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel-national" required>
              </div>
              <div class="msg" id="mPhone"></div>
            </div>

            <button class="btn" id="btn" type="submit">تسجيل</button>
          </form>
        </div>

        <div id="doneView" class="done" hidden>
          <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
          <h3>شكرًا <span id="who"></span></h3>
          <p>جاري تحويلك لصفحة تسجيل المعرض…</p>
          <p><a id="go" href="https://foodafrica-expo.com/Register-To-Visit">اضغط هنا لو الصفحة متفتحتش</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>© EgyGulf Foods</footer>

<script>
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbz-Z-oub4_BvsT3fxPUufilh9_wdJB78BuIphBh3lzhj6QiRGN2-go-ywgtE1UVCwMn/exec";
  const TARGET = "https://foodafrica-expo.com/Register-To-Visit";

  const $ = id => document.getElementById(id);
  const f = $("f"), btn = $("btn");

  function setErr(field, msgEl, text){
    $(field).classList.toggle("bad", !!text);
    $(msgEl).textContent = text || "";
  }
  $("name").addEventListener("input", () => setErr("fName", "mName", ""));
  $("phone").addEventListener("input", () => setErr("fPhone", "mPhone", ""));

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("name").value.trim();
    const company = $("company").value.trim();
    let digits = $("phone").value.replace(/[^\d]/g, "");
    const cc = $("cc").value;

    let ok = true;
    if (name.length < 2) { setErr("fName", "mName", "اكتب اسمك"); ok = false; }
    if (digits.length < 7 || digits.length > 15) { setErr("fPhone", "mPhone", "اكتب رقم صحيح"); ok = false; }
    if (!ok) { (name.length < 2 ? $("name") : $("phone")).focus(); return; }

    if (cc !== "+") digits = digits.replace(/^0+/, "");
    const phone = cc === "+" ? "+" + digits : cc + digits;

    btn.disabled = true;
    btn.textContent = "جاري التسجيل…";

    const body = new URLSearchParams({
      name, company, phone,
      source: new URLSearchParams(location.search).get("ref") || "",
      userAgent: navigator.userAgent
    });
    const save = fetch(SHEET_URL, { method: "POST", mode: "no-cors", body }).catch(() => {});
    await Promise.race([save, new Promise(r => setTimeout(r, 2500))]);

    $("formView").hidden = true;
    $("doneView").hidden = false;
    $("who").textContent = name.split(" ")[0];
    setTimeout(() => location.replace(TARGET), 1500);
  });
</script>
